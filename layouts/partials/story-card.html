{{ $p := . }}
<a href="{{ $p.RelPermalink }}" class="ss-card">
  <div class="ss-card__body">
    {{ with $p.Params.tags }}<span class="ss-card__tagline">{{ delimit . " · " }}</span>{{ end }}
    <h3 class="ss-card__title">{{ $p.Title }}</h3>
    {{ with $p.Params.description }}
    <p class="ss-card__excerpt">{{ . | truncate 120 }}</p>
    {{ end }}
  </div>
  {{ with $p.Params.cover }}
  <div class="ss-card__cover">
    {{ partial "cover-image.html" (dict "cover" . "altText" "" "eager" false "sizes" "86px") }}
  </div>
  {{ end }}
</a>
