<a href="#main-content" class="ss-skip">דלג לתוכן</a>

<header class="ss-header" role="banner">
  <div class="ss-header__inner">
    <a href="{{ "/" | relURL }}" class="ss-logo" aria-label="{{ .Site.Title }} — דף הבית">
      <img src="{{ "images/logo.svg" | relURL }}" alt="" aria-hidden="true" class="ss-logo__img">
      <span class="ss-logo__name">{{ .Site.Title }}</span>
    </a>

    <nav class="ss-nav" aria-label="ניווט ראשי">
      <a href="{{ "/" | relURL }}" class="ss-nav__btn"
         {{ if .IsHome }}aria-current="page"{{ end }}>
        <span class="ss-nav__dot" aria-hidden="true"></span>בית
      </a>
      <a href="{{ "/stories/" | relURL }}" class="ss-nav__btn"
         {{ if eq .Section "stories" }}aria-current="page"{{ end }}>
        <span class="ss-nav__dot" aria-hidden="true"></span>סיפורים
      </a>
      <a href="{{ "/about/" | relURL }}" class="ss-nav__btn"
         {{ if eq .RelPermalink "/about/" }}aria-current="page"{{ end }}>
        <span class="ss-nav__dot" aria-hidden="true"></span>אודות
      </a>
    </nav>

    <button class="ss-theme-btn" id="ss-theme-btn" aria-label="מעבר למצב בהיר">
      <span class="ss-theme-btn__icon" id="ss-theme-icon" aria-hidden="true">☀</span>
      <span class="ss-theme-btn__label" id="ss-theme-label">בהיר</span>
    </button>
  </div>
</header>

<script>
(function () {
  var html = document.documentElement;
  var btn  = document.getElementById('ss-theme-btn');
  var lbl  = document.getElementById('ss-theme-label');
  var ico  = document.getElementById('ss-theme-icon');
  if (!btn) return;

  function apply(t) {
    html.setAttribute('data-theme', t);
    try { localStorage.setItem('ss-theme', t); } catch(e){}
    var dark = t === 'dark';
    if (lbl) lbl.textContent = dark ? 'בהיר' : 'כהה';
    if (ico) ico.textContent = dark ? '☀' : '☽';
    btn.setAttribute('aria-label', dark ? 'מעבר למצב בהיר' : 'מעבר למצב כהה');
  }

  btn.addEventListener('click', function () {
    apply(html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });

  apply(html.getAttribute('data-theme') || 'dark');
}());
</script>
